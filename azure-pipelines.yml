trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- bash: |
    JAVA_BIN=$(readlink -f "$(command -v java)")
    JDK_HOME=$(dirname "$(dirname "$JAVA_BIN")")

    echo "JDK location: $JDK_HOME"

    echo "##vso[task.setvariable variable=JAVA_HOME]$JDK_HOME"
    echo "##vso[task.prependpath]$JDK_HOME/bin"
  displayName: 'Configure JAVA_HOME'

- bash: |
    java -version
    mvn -version
    mvn clean package
  displayName: 'Build Spring Boot Application'